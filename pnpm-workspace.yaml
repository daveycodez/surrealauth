packages:
  - apps/*
  - packages/*

allowBuilds:
  # Its postinstall only downloads the PowerSync core extension, which TanStack DB does not use.
  "@journeyapps/wa-sqlite": false
  "@swc/core": true
  esbuild: true
  nx: true
  sharp: true
  workerd: true

# Upstream fixes applied as a patch; remove it once they are released:
# - @surrealdb/tanstack-db:
#   - https://github.com/surrealdb/tanstack-db/pull/12 live on-demand subsets, removes deleted cached rows
#   - https://github.com/surrealdb/tanstack-db/pull/13 lazy-loads loro-crdt (crashes Worker prerendering)
#   - https://github.com/surrealdb/tanstack-db/pull/14 string record ids (recordIds: "string")
#   - https://github.com/surrealdb/tanstack-db/pull/15 forwards persisted options like initialRender
#   - https://github.com/surrealdb/tanstack-db/pull/16 never mutates the loadSubset request
#   - https://github.com/surrealdb/tanstack-db/pull/17 handles rows already deleted on the server
#   - https://github.com/surrealdb/tanstack-db/pull/18 reopens LIVE queries when the access token changes
#   - https://github.com/surrealdb/tanstack-db/pull/19 retries subset loads after a lost connection
patchedDependencies:
  "@surrealdb/tanstack-db": patches/@surrealdb__tanstack-db.patch
