packages:
  - apps/*
  - packages/*

allowBuilds:
  # Its postinstall only downloads the PowerSync core extension, which TanStack DB does not use.
  "@journeyapps/wa-sqlite": false
  "@swc/core": true
  esbuild: true
  nx: true
  sharp: true
  workerd: true

# Upstream fixes applied as a patch; remove it once they are released:
# - @surrealdb/tanstack-db:
#   - https://github.com/surrealdb/tanstack-db/pull/12 live on-demand subsets, removes deleted cached rows
#   - https://github.com/surrealdb/tanstack-db/pull/14 string record ids (recordIds: "string")
#   - https://github.com/surrealdb/tanstack-db/pull/13 lazy-loads loro-crdt (CRDT-only, unused here;
#     its top-level import crashes prerendering in the Worker)
#   - https://github.com/surrealdb/tanstack-db/pull/17 tolerates a LIVE delete arriving first
patchedDependencies:
  "@surrealdb/tanstack-db": patches/@surrealdb__tanstack-db.patch
