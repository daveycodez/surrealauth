packages:
  - apps/*
  - packages/*

allowBuilds:
  # Its postinstall only downloads the PowerSync core extension, which TanStack DB does not use.
  "@journeyapps/wa-sqlite": false
  "@swc/core": true
  esbuild: true
  nx: true
  sharp: true
  workerd: true

# Upstream fixes applied as patches; remove each once it is released:
# - @surrealdb/tanstack-db: https://github.com/surrealdb/tanstack-db/pull/13 lazy-loads loro-crdt
#   (CRDT-only, unused here; its top-level import crashes prerendering in the Worker)
# - @tanstack/db: https://github.com/TanStack/db/pull/2460 compares classes with toJSON() (e.g. RecordId)
#   by value, so eq(), joins, indexes and useLiveQuery identity work with record ids
patchedDependencies:
  "@surrealdb/tanstack-db": patches/@surrealdb__tanstack-db.patch
  "@tanstack/db": patches/@tanstack__db.patch
