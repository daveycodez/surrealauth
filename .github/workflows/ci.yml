name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # Public endpoint inlined into the client bundle by `vite build` (see apps/web/.env.example).
      VITE_SURREAL_URL: wss://06h01ki929o216lckkdmj1d92c.surrealdb.earth/rpc
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5

      - run: pnpm nx format:check --base=$NX_BASE --head=$NX_HEAD
      - run: pnpm nx affected -t lint typecheck build

      - name: Install SurrealDB and SurrealKit
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o surreal.tgz https://github.com/surrealdb/surrealdb/releases/download/v4.0.0/surreal-v4.0.0.linux-amd64.tgz
          echo "e910760179b9f13d0773ce98ac50f9a537051156365239284c2dc687adf3049d  surreal.tgz" | sha256sum -c -
          tar -xzf surreal.tgz -C "$HOME/.local/bin" surreal
          curl -fsSL -o surrealkit.tgz https://github.com/surrealdb/surrealkit/releases/download/v1.0.0-rc.1/surrealkit-v1.0.0-rc.1-x86_64-unknown-linux-gnu.tar.gz
          echo "2588ea8f4309b6fcb07aac61835952c4bbbbf840b22f625563ba2d3075ea9218  surrealkit.tgz" | sha256sum -c -
          tar -xzf surrealkit.tgz -C "$HOME/.local/bin" surrealkit
          rm surreal.tgz surrealkit.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx affected -t e2e
